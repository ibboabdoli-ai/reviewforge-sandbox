name: Sandbox fixture tests
on:
  push:
    branches:
      - test/mixed-clean-bugs-20261102
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364 # v4.2.2
        with:
          persist-credentials: false
      - name: Run synthetic Node tests
        run: node --test tests/*.test.mjs
