name: Precision sandbox fixtures
on:
  push:
    branches:
      - test/precision-mix-20261102
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run standalone synthetic Node tests
        run: node --test tests/*.test.mjs
